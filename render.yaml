services:
  - type: web
    name: vg-ment4l
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vg-ment4l-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_GAMEPLAY_MODEL
        value: gpt-5.6-luna

databases:
  - name: vg-ment4l-db
    plan: free
